<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172b4d">
<meta property="og:title" content="അസാസുൽ ഉലൂം ഹയർ സെക്കൻഡറി മദ്രസ – പനക്കോട്">
<meta property="og:description" content="ചരിത്രം, പ്രോത്സാഹന സന്ദേശം, അർദ്ധവാർഷിക പരീക്ഷാ ഫലം">
<title>അസാസുൽ ഉലൂം ഹയർ സെക്കൻഡറി മദ്രസ | പനക്കോട്</title>
<style>
:root{--navy:#172b4d;--navy2:#244b78;--gold:#c9a45c;--cream:#fffaf0;--ink:#20304a;--muted:#65738a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,"Noto Sans Malayalam",sans-serif;color:var(--ink)}
body{background:linear-gradient(135deg,#eff4fa,#fff8e9)}
button{font:inherit;cursor:pointer}
#intro{min-height:100vh;display:flex;flex-direction:column}
.topline{height:7px;background:linear-gradient(90deg,var(--gold),#f4dfaa,var(--gold))}
.intro-head{width:min(940px,100%);margin:0 auto;padding:18px 18px 0;display:flex;align-items:center;justify-content:space-between}
.brandmark{width:66px;height:66px;object-fit:contain;background:#fff;border:2px solid var(--gold);border-radius:50%;padding:4px}
.pageno{font-size:13px;color:var(--muted);font-weight:700}
.page{display:none;width:min(940px,100%);margin:0 auto;padding:18px 18px 24px;flex:1}
.page.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}
.paper{background:#fff;border:1px solid #e6d9bd;border-radius:24px;box-shadow:0 12px 34px #1d355712;overflow:hidden}
.hero{background:linear-gradient(125deg,#10264a,#244b78);color:white;text-align:center;padding:23px 20px 20px;border-bottom:5px solid var(--gold)}
.hero img{width:90px;height:90px;object-fit:contain;background:white;border-radius:50%;padding:5px;border:3px solid var(--gold)}
.hero h1{font-size:clamp(21px,4.7vw,31px);line-height:1.35;color:#ffe3a1;margin:12px 0 3px}
.hero p{margin:3px 0;font-weight:650;letter-spacing:.5px}
.reg{font-size:13px;color:#f4dfaa;margin-top:7px!important}
.building{display:block;width:100%;max-height:300px;object-fit:cover}
.details{padding:17px 20px 22px}
.address{text-align:center;line-height:1.7;color:#52627a;font-size:13px;font-weight:700;letter-spacing:.35px;margin:0 0 16px}
.contact-grid{display:grid;grid-template-columns:1fr;gap:9px}
.contact{border:1px solid #e9dfcb;background:#fffdf8;border-radius:13px;padding:10px 13px}
.contact .role{display:block;color:#9b7738;font-size:11px;font-weight:800;letter-spacing:.8px}
.contact strong{display:block;color:var(--navy);font-size:14px;margin:2px 0}
.contact a{color:#3e6287;text-decoration:none;font-weight:700;font-size:13px}
.teachers{margin-top:12px;border:1px solid #e9dfcb;background:#fffdf8;border-radius:14px;padding:12px 14px}
.teachers h3{margin:0 0 8px;color:#9b7738;font-size:12px;letter-spacing:.6px}
.teacher-list{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.teacher{font-size:13px;line-height:1.5}
.teacher b{display:block;color:var(--navy)}
.teacher a{color:#3e6287;text-decoration:none;font-size:12px;font-weight:700}
.story{padding:24px clamp(18px,4vw,34px);line-height:1.95;font-size:15px}
.page-title{text-align:center;color:var(--navy);font-size:clamp(23px,5vw,32px);line-height:1.45;margin:6px 0 4px}
.subtitle{text-align:center;color:#a17c3e;font-weight:750;margin:0 0 22px;font-size:15px}
.section{margin:17px 0 0}
.section h3{display:inline-block;background:var(--navy);color:#fff;padding:7px 15px;border-radius:9px;font-size:16px;margin:0 0 9px}
.section p{margin:0;color:#33435b}
.encourage{padding:25px clamp(18px,5vw,42px);text-align:center;line-height:1.95}
.encourage h2{margin:3px 0 18px;color:var(--navy);font-size:clamp(25px,5.5vw,34px)}
.encourage p{font-size:15px;text-align:left;line-height:2;margin:0 0 14px}
.quote{margin:21px 0 16px;padding:18px 14px;border-radius:16px;background:#f8f1e2;border:1px solid #ead9b6;color:var(--navy);font-weight:750;line-height:1.9}
.quote strong{display:block;font-size:20px;color:#9a7332}
.big-message{font-size:clamp(19px,4vw,25px);font-weight:850;color:var(--navy);line-height:1.8;margin:15px 0}
.gateway{padding:36px 22px;text-align:center}
.gateway img{width:105px;height:105px;object-fit:contain;background:#fff;border:3px solid var(--gold);border-radius:50%;padding:6px}
.gateway h2{font-size:clamp(23px,5vw,31px);line-height:1.4;color:var(--navy);margin:13px 0 2px}
.gateway .year{font-size:17px;color:#9b7738;font-weight:800;margin:4px 0 16px}
.gateway p{line-height:1.9;color:#53627a;margin:0 auto 20px;max-width:530px}
.start-btn,.nav-btn{border:0;border-radius:13px;font-weight:800}
.start-btn{padding:16px 32px;background:linear-gradient(120deg,#17355d,#285988);color:#fff;font-size:20px;box-shadow:0 7px 18px #172b4d2a;border:2px solid var(--gold)}
.navbar{width:min(940px,100%);margin:0 auto;padding:0 18px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav-btn{padding:11px 18px;background:#fff;border:1px solid #dac89f;color:var(--navy);min-width:112px}
.nav-btn.primary{background:var(--navy);color:white;border-color:var(--navy)}
.nav-btn:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#d8ccb2}
.dot.on{width:22px;border-radius:10px;background:var(--gold)}
#resultsScreen{display:none;min-height:100vh;background:#f4f6f9}
.resultbar{position:sticky;top:0;z-index:5;background:#172b4d;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;color:#fff;gap:8px}
.resultbar span{font-size:13px;font-weight:700}
.resultbar button{border:1px solid #e3ca8f;border-radius:9px;background:#fff7e6;color:#172b4d;font-weight:800;padding:8px 12px}
#resultFrame{display:block;width:100%;height:calc(100vh - 48px);border:0;background:white}
@media(min-width:650px){
 .contact-grid{grid-template-columns:repeat(3,1fr)}
 .teachers .teacher-list{grid-template-columns:repeat(3,1fr)}
 .building{max-height:330px}
 .page{padding-top:22px}
}
@media(max-width:380px){.intro-head{padding-top:12px}.brandmark{width:54px;height:54px}.teacher-list{grid-template-columns:1fr}.story{font-size:14px}}
</style>
</head>

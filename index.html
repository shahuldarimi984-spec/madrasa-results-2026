function showOnly(panel,saveHistory=true){
  panels.forEach(p=>p.classList.add("hidden"));
  panel.classList.remove("hidden");
  if(saveHistory){
    history.pushState({panel:panel.id},"","#"+panel.id);
  }
}

window.addEventListener("popstate",e=>{
  const panelId=e.state?.panel||"classPanel";
  const panel=document.getElementById(panelId);
  if(panel){
    panels.forEach(p=>p.classList.add("hidden"));
    panel.classList.remove("hidden");
    if(panelId==="studentPanel"){
      selectedStudent="";
      document.getElementById("dob").value="";
      document.getElementById("status").textContent="";
    }
    if(panelId==="dobPanel"){
      document.getElementById("status").textContent="";
    }
  }
});

function grade(mark){
  if(mark===null||mark===undefined)return "ലഭ്യമല്ല";
  if(mark>=45)return "A+";
  if(mark>=40)return "A";
  if(mark>=35)return "B+";
  if(mark>=30)return "B";
  if(mark>=25)return "C+";
  if(mark>=20)return "C";
  if(mark>=18)return "D+";
  if(mark>=1)return "D";
  return "—";
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

        ["ദീനിയാത്ത് & അഖ്ലാഖ്",r.deeniyath_mark],
        ["എഴുത്ത്",r.writing_mark],
        ["വായന",r.reading_mark]
      ];
      maxTotal=200;
    }

    const rows=subjects.map(([label,mark])=>{
      const value=String(mark??"").trim();
      const absent=value.toUpperCase()==="A";
      const missing=mark===null||mark===undefined||value===""||value==="—";
      const numericMark=missing||absent?null:Number(value);

      const markText=absent
        ?"A (ഹാജരില്ല)"
        :missing
          ?"—"
          :Number.isFinite(numericMark)
            ?numericMark+" / 50"
            :"—";

      const gradeText=absent
        ?"ഹാജരില്ല"
        :missing
          ?"—"
          :Number.isFinite(numericMark)
            ?grade(numericMark)
            :"—";

      return `<tr><td>${escapeHTML(label)}</td><td>${markText}</td><td>${gradeText}</td></tr>`;
    }).join("");

    const calculatedTotal=subjects.reduce((sum,[,mark])=>{
      const value=String(mark??"").trim();
      if(value.toUpperCase()==="A"||value==="—"||value==="")return sum;
      const n=Number(value);
      return sum+(Number.isFinite(n)?n:0);
    },0);

    const total=r.total_marks!==null&&r.total_marks!==undefined
      ?Number(r.total_marks):calculatedTotal;

    const attendance=Number(r.attendance)||0;

    const workingDays=Number(
      selectedClass==="10"?r.working_days:
      selectedClass==="9"?r.working_days:
      selectedClass==="7"?r.working_days:
      selectedClass==="3"?r.working_days:
      selectedClass==="5"?r.working_days:
      selectedClass==="6"?r.working_days:
      r.total_working_days
    )||(selectedClass==="10"?147:selectedClass==="9"?146:selectedClass==="7"?152:selectedClass==="3"?151:selectedClass==="5"?147:selectedClass==="6"?148:selectedClass==="4"?148:selectedClass==="2"?148:140);

    const weakSubjects=subjects
      .filter(([label,mark])=>{
        const value=String(mark??"").trim();
        return value!==""&&value!=="—"&&value.toUpperCase()!=="A"&&Number.isFinite(Number(value))&&Number(value)<25;
      })
      .map(([label])=>label);

    const strongSubjects=subjects
      .filter(([label,mark])=>{
        const value=String(mark??"").trim();
        return value!==""&&value!=="—"&&value.toUpperCase()!=="A"&&Number.isFinite(Number(value))&&Number(value)>=40;
      })
      .map(([label])=>label);

    let teacherComment="";
    const ratio=total/maxTotal;

    if(ratio>=0.90)teacherComment="മികച്ച വിജയം. എല്ലാ വിഷയങ്ങളിലും ഈ മികവ് നിലനിർത്താൻ ശ്രമിക്കുക. അല്ലാഹു കൂടുതൽ അറിവും വിജയവും നൽകട്ടെ.";
    else if(ratio>=0.80)teacherComment="വളരെ നല്ല പ്രകടനമാണ്. പഠനത്തിലെ ഈ മുന്നേറ്റം തുടരുക. അല്ലാഹു അനുഗ്രഹിക്കട്ടെ.";
    else if(ratio>=0.65)teacherComment="നല്ല ശ്രമം നടത്തിയിട്ടുണ്ട്. സ്ഥിരമായ പഠനത്തിലൂടെ ഇനിയും മികച്ച വിജയം നേടാൻ കഴിയും. അല്ലാഹു തൗഫീഖ് നൽകട്ടെ.";
    else if(ratio>=0.50)teacherComment="ഇനിയും മെച്ചപ്പെടാൻ നല്ല അവസരമുണ്ട്. ദിവസവും കുറച്ചുസമയം പഠനത്തിന് മാറ്റിവെച്ച് അധ്യാപകരുടെ നിർദേശങ്ങൾ പാലിക്കുക. അല്ലാഹു സഹായിക്കട്ടെ.";
    else teacherComment="കൂടുതൽ ശ്രദ്ധയും സ്ഥിരമായ പരിശീലനവും ആവശ്യമാണ്. രക്ഷിതാക്കളും അധ്യാപകരും ചേർന്ന് കുട്ടിക്ക് പിന്തുണ നൽകുക. അല്ലാഹു എളുപ്പമാക്കട്ടെ.";

    if(weakSubjects.length)teacherComment+=" പ്രത്യേകിച്ച് "+weakSubjects.join(", ")+" എന്നീ വിഷയങ്ങളിൽ കൂടുതൽ പരിശീലനം നൽകണം.";
    if(strongSubjects.length)teacherComment+=" "+strongSubjects.join(", ")+" വിഷയങ്ങളിലെ മികച്ച പ്രകടനം അഭിനന്ദനാർഹമാണ്.";

    if(attendance>=Math.ceil(workingDays*0.90))teacherComment+=" ഹാജർ വളരെ മികച്ചതാണ്.";
    else if(attendance>=Math.ceil(workingDays*0.80))teacherComment+=" ഹാജർ തൃപ്തികരമാണ്; കഴിയുന്നത്ര സ്ഥിരമായി ക്ലാസിൽ പങ്കെടുക്കണം.";
    else teacherComment+=" ഹാജർ മെച്ചപ്പെടുത്താൻ പ്രത്യേകം ശ്രദ്ധിക്കണം.";

    const rankRow=`<tr><td>ക്ലാസ് റാങ്ക്</td><td colspan="2"><b>${escapeHTML(r.class_rank??"—")}</b></td></tr>`;

    document.getElementById("resultContent").innerHTML=
      `<p><b>വിദ്യാർത്ഥി:</b> ${escapeHTML(name)}</p>
      <table>${rows}
      <tr><td>ആകെ മാർക്ക്</td><td colspan="2"><b>${total} / ${maxTotal}</b></td></tr>
      ${rankRow}
      <tr><td>ഹാജർ</td><td colspan="2"><b>${attendance} / ${workingDays}</b></td></tr>
      </table>
      <div class="feedback">
      <h3>അധ്യാപകന്റെ അഭിപ്രായം</h3>
      <p id="teacherComment"></p>
      <h3 style="margin-top:18px">രക്ഷിതാവിന്റെ അഭിപ്രായം</h3>
      <textarea id="parentComment" placeholder="രക്ഷിതാവിന്റെ അഭിപ്രായം ഇവിടെ എഴുതുക..."></textarea>
      <button class="whatsapp-btn" id="sendWhatsappBtn" type="button">WhatsApp വഴി പ്രധാനാധ്യാപകന് അയക്കാം</button>
      </div>
      <p class="big">അഭിനന്ദനങ്ങൾ!</p>`;

    document.getElementById("teacherComment").textContent=teacherComment;

    document.getElementById("sendWhatsappBtn").onclick=()=>{
      const parentComment=document.getElementById("parentComment").value.trim();

      if(!parentComment){
        alert("രക്ഷിതാവിന്റെ അഭിപ്രായം എഴുതുക.");
        return;
      }

      const message=
        "വിദ്യാർത്ഥി: "+name+"\n"+
        "ക്ലാസ്: "+selectedClass+"\n"+
        "രക്ഷിതാവിന്റെ അഭിപ്രായം: "+parentComment;

      const whatsappUrl="https://wa.me/919645154849?text="+encodeURIComponent(message);
      window.open(whatsappUrl,"_blank");
    };

    history.replaceState({panel:"studentPanel"},"","#studentPanel");
    history.pushState({panel:"resultPanel"},"","#resultPanel");

    showOnly(document.getElementById("resultPanel"),false);
    status.textContent="";

  }catch(err){
    status.textContent="ERROR: "+(err.message||JSON.stringify(err));
    console.error(err);
  }finally{
    btn.disabled=false;
  }
};
</script>
</body>
</html>
